[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "framebudget"
version = "0.1.0"
description = "Fit a video into a token budget for multimodal LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "video",
    "llm",
    "vlm",
    "multimodal",
    "keyframe",
    "frame-selection",
    "token-budget",
    "preprocessing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.urls]
Homepage = "https://github.com/DeyvidLucas-DEV/framebudget"
Repository = "https://github.com/DeyvidLucas-DEV/framebudget"
Issues = "https://github.com/DeyvidLucas-DEV/framebudget/issues"
Changelog = "https://github.com/DeyvidLucas-DEV/framebudget/blob/main/CHANGELOG.md"

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
framebudget = "framebudget.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/framebudget"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# No python_version pin. numpy ships stubs using 3.12 syntax, and pinning to the
# minimum supported version makes mypy fail parsing them rather than checking us.
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
